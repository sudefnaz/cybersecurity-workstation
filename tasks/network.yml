---
- name: Disable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "0"
    state: present
    sysctl_file: /etc/sysctl.d/99-cybersecurity-hardening.conf
    reload: true
  when: disable_ipv4_forwarding

- name: Disable IPv6 forwarding
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "0"
    state: present
    sysctl_file: /etc/sysctl.d/99-cybersecurity-hardening.conf
    reload: true
  when: disable_ipv6_forwarding

- name: Disable IPv4 ICMP redirects
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.accept_redirects
    value: "0"
    state: present
    sysctl_file: /etc/sysctl.d/99-cybersecurity-hardening.conf
    reload: true
  when: disable_icmp_redirects

- name: Disable IPv6 ICMP redirects
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.accept_redirects
    value: "0"
    state: present
    sysctl_file: /etc/sysctl.d/99-cybersecurity-hardening.conf
    reload: true
  when: disable_icmp_redirects

- name: Disable IPv4 ICMP send redirects
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.send_redirects
    value: "0"
    state: present
    sysctl_file: /etc/sysctl.d/99-cybersecurity-hardening.conf
    reload: true
  when: disable_icmp_redirects
# Additional kernel hardening
- name: Configure protected hardlinks
  ansible.posix.sysctl:
    name: fs.protected_hardlinks
    value: "1"
    state: present
    sysctl_file: /etc/sysctl.d/99-cybersecurity-hardening.conf
    reload: true

- name: Configure protected symlinks
  ansible.posix.sysctl:
    name: fs.protected_symlinks
    value: "1"
    state: present
    sysctl_file: /etc/sysctl.d/99-cybersecurity-hardening.conf
    reload: true

- name: Restrict ptrace scope
  ansible.posix.sysctl:
    name: kernel.yama.ptrace_scope
    value: "1"
    state: present
    sysctl_file: /etc/sysctl.d/99-cybersecurity-hardening.conf
    reload: true

- name: Restrict core dump handling
  ansible.posix.sysctl:
    name: fs.suid_dumpable
    value: "0"
    state: present
    sysctl_file: /etc/sysctl.d/99-cybersecurity-hardening.conf
    reload: true

- name: Restrict kernel message access
  ansible.posix.sysctl:
    name: kernel.dmesg_restrict
    value: "1"
    state: present
    sysctl_file: /etc/sysctl.d/99-cybersecurity-hardening.conf
    reload: true

