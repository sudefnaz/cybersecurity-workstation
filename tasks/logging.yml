---
- name: Ensure rsyslog is enabled and running
  ansible.builtin.service:
    name: rsyslog
    enabled: true
    state: started
  when: rsyslog_enabled

- name: Ensure auditd is enabled and running
  ansible.builtin.service:
    name: auditd
    enabled: true
    state: started
  when: auditd_enabled

- name: Configure audit rules for security-sensitive files
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-cybersecurity.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      -w /etc/passwd -p wa -k identity
      -w /etc/group -p wa -k identity
      -w /etc/shadow -p wa -k identity
      -w /etc/gshadow -p wa -k identity

      -w /etc/sudoers -p wa -k privilege
      -w /etc/sudoers.d/ -p wa -k privilege

      -w /etc/ssh/sshd_config -p wa -k ssh_config
      -w /etc/ssh/sshd_config.d/ -p wa -k ssh_config

      -w /etc/security/pwquality.conf -p wa -k password_policy
      -w /etc/login.defs -p wa -k password_policy

      -w /etc/sysctl.conf -p wa -k system_network
      -w /etc/sysctl.d/ -p wa -k system_network

      -w /etc/audit/ -p wa -k audit_config
  notify: Reload audit rules
  when: auditd_enabled

- name: Ensure audit log directory has restricted permissions
  ansible.builtin.file:
    path: /var/log/audit
    owner: root
    group: root
    mode: '0750'
    state: directory
  when: auditd_enabled
